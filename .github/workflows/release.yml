name: Release

# On every push to develop: if changesets are pending, open/update the "Version Packages"
# pull request; once that PR is merged (no pending changesets, unpublished versions), publish
# the three packages to npm with provenance via trusted publishing — no npm token anywhere.
#
# One-time setup (maintainers): the first 0.7.0 publish is done manually (`npm login` +
# `npm run release`), then each package gets this repository + workflow registered as its
# Trusted Publisher on npmjs.com. Settings → Actions must allow GitHub Actions to create
# pull requests.

on:
  push:
    branches: [develop]

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - name: Create the release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
