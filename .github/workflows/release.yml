name: Release

# Two rungs, two jobs:
#
#   develop     — with changesets pending, open/update the "Version Packages" pull request
#                 (one bump for the fixed group + the CHANGELOG entries). Merging it lands the
#                 bump on develop. Nothing is published here.
#   production  — publish every not-yet-published version to npm with provenance via trusted
#                 publishing (no npm token anywhere) and create the GitHub releases. Only a
#                 push to production publishes; it refuses if changesets are still pending
#                 (version on develop first).
#
# production only ever receives staging, which only ever receives develop (fast-forwards).
#
# One-time setup (maintainers): the first 0.7.0 publish was done manually (`npm login` +
# `npm run release`), then each package got this repository + workflow registered as its
# Trusted Publisher on npmjs.com. Settings → Actions must allow GitHub Actions to create
# pull requests.

on:
  push:
    branches: [develop, production]

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version PR (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Open or update the release PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm (production)
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Refuse to publish with changesets still pending
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v '/README.md$' || true)
          if [ -n "$pending" ]; then
            echo "::error::Pending changesets on production — merge the Version Packages PR on develop and promote again:"
            echo "$pending"
            exit 1
          fi
      - name: Publish the unpublished versions (npm run release = build + changeset publish)
        uses: changesets/action@v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
